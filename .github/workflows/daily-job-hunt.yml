name: Daily Job Hunt

on:
  schedule:
    # 09:30 UTC every day — adjust to taste
    - cron: "30 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run daily job hunt
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 daily_jobs.py

      - name: Commit refreshed dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.html seen.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily job hunt refresh"
            git push
          fi
